<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<header class="bg-dark text-white p-3">
    <div class="container">
        <h1>Web App</h1>

        <nav>
            <a href="/" class="text-white me-3">Главная</a>
            <a href="/contacts" class="text-white">Контакты</a>
        </nav>
    </div>
</header>

<main class="container my-5">

    <div class="row">
        <div class="col-12 col-md-8">

            <h2 class="mb-4">Связаться с нами</h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Имя</label>

                    <input type="text"
                           name="name"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email"
                           name="email"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Сообщение</label>

                    <textarea name="message"
                              class="form-control"
                              rows="5"></textarea>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Отправить
                </button>

            </form>

        </div>
    </div>

</main>

<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© 2026 Web App</p>
</footer>

</body>
</html>
